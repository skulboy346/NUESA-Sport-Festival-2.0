<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOS Portal | NUESA FESTIVAL 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        h1, h2, h3 { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .neon-green { color: #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.7); }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div class="bg-black text-white py-2 px-4 flex justify-between items-center z-50 relative border-b border-slate-800">
        <span class="text-[10px] md:text-xs font-bold tracking-widest text-slate-400 hidden md:block">NUESA SPORT FESTIVAL 2.0 (DEAN'S CUP '26)</span>
        <span class="text-[10px] md:text-xs font-bold tracking-widest text-slate-400 md:hidden">NUESA FEST 2.0</span>
        <div class="flex space-x-4 text-slate-300 text-sm">
            <a href="https://www.instagram.com/theambassadors_sport" target="_blank" class="hover:text-pink-500 transition transform hover:scale-110"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://x.com/Ambassador30788" target="_blank" class="hover:text-white transition transform hover:scale-110"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://wa.me/2348113032943" target="_blank" class="hover:text-green-500 transition transform hover:scale-110"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </div>

    <div id="login-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/90 backdrop-blur-sm p-4 transition-all">
        <div class="bg-slate-800 p-8 max-w-sm w-full text-center rounded-2xl shadow-[0_0_40px_rgba(16,185,129,0.2)] border border-emerald-500">
            <i class="fa-solid fa-clipboard-user text-5xl neon-green mb-4"></i>
            <h2 class="text-3xl font-black text-white mb-1 tracking-wide">DOS PORTAL</h2>
            <p class="text-xs text-slate-400 mb-6 font-bold tracking-widest uppercase">The Imperium - Registration</p>
            
            <select id="login-dept" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg p-4 text-center text-xl mb-4 focus:border-emerald-500 outline-none font-black transition">
                <option value="" disabled selected>SELECT DEPARTMENT</option>
                <option value="AESA">AESA (Art Education)</option>
                <option value="NAAES">NAAES (Adult Education)</option>
                <option value="ULSESA">ULSESA (Science Education)</option>
                <option value="SSESA">SSESA (Social Science Education)</option>
                <option value="TVESA">TVESA (Tech & Vocational)</option>
                <option value="EFSA">EFSA (Educational Foundation)</option>
                <option value="EMSA">EMSA (Educational Management)</option>
                <option value="NAPHER-SD">NAPHER-SD (Human Kinetics)</option>
            </select>
            
            <input type="password" id="login-pin" placeholder="DEPT PASSWORD" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg p-4 text-center tracking-widest text-lg mb-4 focus:border-emerald-500 outline-none uppercase font-black transition">

            <button onclick="loginDOS()" class="w-full bg-emerald-600 text-white font-black tracking-widest py-4 rounded-lg hover:bg-emerald-500 transition shadow-lg">AUTHENTICATE</button>
            <p id="login-error" class="text-red-500 text-xs font-bold mt-4 hidden tracking-widest uppercase"><i class="fa-solid fa-triangle-exclamation"></i> INVALID CREDENTIALS</p>
        </div>
    </div>

    <nav class="bg-slate-900 border-b border-slate-800 shadow-xl sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-clipboard-user text-emerald-500 text-2xl"></i>
                <span class="text-xl font-black text-white tracking-tighter block">DOS<span class="text-emerald-500">PORTAL</span></span>
            </div>
            <div class="flex gap-3">
                <button onclick="downloadRosterPDF()" class="bg-slate-800 text-white text-xs font-bold px-3 py-2 rounded border border-slate-700 hover:bg-slate-700 transition uppercase tracking-widest"><i class="fa-solid fa-file-pdf text-red-400 mr-1"></i> PDF</button>
                <div id="active-dept-label" class="text-slate-400 font-bold tracking-widest uppercase bg-slate-800 px-3 py-2 rounded"></div>
            </div>
        </div>
    </nav>

    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full space-y-6">
        
        <div id="gate-warning" class="hidden bg-red-900/30 border border-red-500 text-red-400 p-4 rounded-lg text-center font-bold uppercase tracking-wide">
            <i class="fa-solid fa-lock mr-2"></i> Registration Portal is currently Closed by Admin.
        </div>

        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                <h2 class="text-2xl font-black text-white" id="form-title">Add Participant</h2>
                <div id="sport-limit-tracker" class="text-xs font-bold text-slate-400 uppercase tracking-widest bg-slate-900 px-3 py-1 rounded border border-slate-600">Select sport to see limits</div>
            </div>
            
            <form id="addAthleteForm" class="space-y-4">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                    <input type="text" id="pName" required placeholder="Full Name" class="md:col-span-2 bg-slate-900 border border-slate-600 text-white rounded p-3 outline-none focus:border-emerald-500 font-bold uppercase">
                    <input type="text" id="pMatric" required placeholder="Matric No" maxlength="9" class="bg-slate-900 border border-slate-600 text-white rounded p-3 outline-none focus:border-emerald-500 font-mono uppercase">
                    <input type="text" id="pReceipt" required placeholder="NUESA Receipt (e.g. CUB_12345)" class="md:col-span-2 bg-slate-900 border border-slate-600 text-white rounded p-3 outline-none focus:border-emerald-500 font-mono uppercase">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <select id="pLevel" required class="bg-slate-900 border border-slate-600 text-white rounded p-3 outline-none focus:border-emerald-500 uppercase text-sm font-bold">
                        <option value="" disabled selected>Level</option>
                        <option value="100L">100L</option><option value="200L">200L</option><option value="300L">300L</option><option value="400L">400L</option>
                    </select>
                    <select id="pGender" required class="bg-slate-900 border border-slate-600 text-white rounded p-3 outline-none focus:border-emerald-500 uppercase text-sm font-bold">
                        <option value="" disabled selected>Gender</option>
                        <option value="Male">Male</option><option value="Female">Female</option>
                    </select>
                    <select id="pRole" required class="bg-slate-900 border border-slate-600 text-white rounded p-3 outline-none focus:border-emerald-500 uppercase text-sm font-bold">
                        <option value="" disabled selected>Role</option>
                        <option value="Athlete">Athlete / Player</option><option value="Coach">Coach</option>
                    </select>
                    <select id="pSport" required onchange="updateLimitTracker()" class="md:col-span-2 bg-slate-900 border border-slate-600 text-white rounded p-3 outline-none focus:border-emerald-500 uppercase text-sm font-bold">
                        <option value="" disabled selected>Select Event</option>
                        <optgroup label="BALL GAMES">
                            <option value="Football">Football</option><option value="Volleyball">Volleyball</option>
                            <option value="Handball">Handball</option><option value="Futsal">Futsal</option>
                            <option value="Basketball">Basketball</option>
                        </optgroup>
                        <optgroup label="INDOOR GAMES">
                            <option value="Table Tennis">Table Tennis</option><option value="Tennis">Tennis</option>
                            <option value="Badminton">Badminton</option><option value="Ayo">Ayo</option>
                            <option value="Scrabble">Scrabble</option><option value="Chess">Chess</option>
                            <option value="Ludo">Ludo</option><option value="Efootball">Efootball</option>
                            <option value="COD">COD</option>
                        </optgroup>
                        <optgroup label="ATHLETICS">
                            <option value="Swimming">Swimming</option><option value="Walking-Race">Walking-Race</option>
                            <option value="100m">100m</option><option value="200m">200m</option>
                            <option value="400m">400m</option><option value="800m">800m</option>
                            <option value="1500m">1500m</option><option value="4 x 100m">4 x 100m</option>
                            <option value="4 x 400m Mix">4 x 400m Mix</option><option value="Long-Jump">Long-Jump</option>
                        </optgroup>
                    </select>
                </div>
                
                <input type="tel" id="pPhone" required placeholder="WhatsApp Phone Number" class="w-full bg-slate-900 border border-slate-600 text-white rounded p-3 outline-none focus:border-emerald-500 font-mono">

                <div class="flex gap-2 pt-2">
                    <button type="submit" id="btnAdd" class="w-full bg-emerald-600 text-white font-black tracking-widest py-3 rounded hover:bg-emerald-500 transition shadow-lg">ADD PARTICIPANT</button>
                    <button type="button" onclick="cancelEdit()" id="btnCancel" class="hidden w-1/3 bg-slate-700 text-white font-black tracking-widest py-3 rounded hover:bg-slate-600 transition shadow-lg">CANCEL</button>
                </div>
            </form>
        </div>

        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl" id="roster-print-area">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                <h2 class="text-2xl font-black text-white">Official Roster</h2>
                <span id="roster-count" class="bg-emerald-900/30 text-emerald-400 px-3 py-1 rounded text-xs font-bold border border-emerald-900/50">0 Participants</span>
            </div>
            <div id="roster-list" class="space-y-4">
                <div class="text-center py-10 text-slate-500 font-bold">Loading Roster...</div>
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ADD YOUR FIREBASE CONFIG HERE
        const firebaseConfig = {
            apiKey: "AIzaSyAr2aGfBXiQ2V9nx3stCHv51NQb83ATex4",
            authDomain: "nuesa-sport-festival-26.firebaseapp.com",
            projectId: "nuesa-sport-festival-26",
            storageBucket: "nuesa-sport-festival-26.firebasestorage.app",
            messagingSenderId: "707147353888",
            appId: "1:707147353888:web:770a7ec13bc19951f59145"
        };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);

        let currentDept = null;
        let rosterData = [];
        let isGateOpen = false;

        const deptPasswords = { "AESA": "AESA26", "NAAES": "NAAES26", "ULSESA": "ULSESA26", "SSESA": "SSESA26", "TVESA": "TEVES26", "EFSA": "EFSA26", "EMSA": "EMSA26", "NAPHER-SD": "NAPHER26" };
        const deptCodes = { "AESA": "0317", "NAAES": "0310", "ULSESA": "0310", "SSESA": "0323", "TVESA": "0319", "EFSA": "0305", "EMSA": "0302", "NAPHER-SD": "0314" };
        const ballGames = ["Football", "Volleyball", "Handball", "Futsal", "Basketball"];

        const sportLimits = {
            "Football": { max: 21, maleMax: 21, femaleMax: 0 },
            "Volleyball": { max: 12, minFemale: 1 }, "Handball": { max: 14, minFemale: 2 },
            "Futsal": { max: 11, maleMax: 0, femaleMax: 11 }, "Basketball": { max: 12, minFemale: 1 },
            "Table Tennis": { max: 2 }, "Tennis": { max: 3 }, "Badminton": { max: 2 },
            "Ayo": { max: 2 }, "Scrabble": { max: 2 }, "Chess": { max: 2 }, "Ludo": { max: 2 },
            "Efootball": { max: 2 }, "COD": { max: 4 },
            "Swimming": { max: 2, maleMax: 1, femaleMax: 1 }, "Walking-Race": { max: 6, maleMax: 3, femaleMax: 3 },
            "100m": { max: 4, maleMax: 2, femaleMax: 2 }, "200m": { max: 4, maleMax: 2, femaleMax: 2 },
            "400m": { max: 4, maleMax: 2, femaleMax: 2 }, "800m": { max: 4, maleMax: 2, femaleMax: 2 },
            "1500m": { max: 6, maleMax: 3, femaleMax: 3 }, "4 x 100m": { max: 8, maleMax: 4, femaleMax: 4 },
            "4 x 400m Mix": { max: 4, maleMax: 2, femaleMax: 2 }, "Long-Jump": { max: 2, maleMax: 1, femaleMax: 1 }
        };

        onSnapshot(doc(db, "nuesa_fest_settings", "system"), (doc) => {
            if(doc.exists()) {
                isGateOpen = doc.data().registrationGate === 'open';
                document.getElementById('gate-warning').style.display = isGateOpen ? 'none' : 'block';
                const inputs = ['pName', 'pMatric', 'pReceipt', 'pLevel', 'pGender', 'pRole', 'pPhone', 'pSport', 'btnAdd'];
                inputs.forEach(id => { document.getElementById(id).disabled = !isGateOpen; });
                document.getElementById('btnAdd').className = isGateOpen ? "w-full bg-emerald-600 text-white font-black tracking-widest py-3 rounded hover:bg-emerald-500 transition shadow-lg" : "w-full bg-slate-600 text-slate-400 font-black tracking-widest py-3 rounded cursor-not-allowed";
                renderRoster();
            }
        });

        window.loginDOS = async () => {
            const dept = document.getElementById('login-dept').value;
            const pin = document.getElementById('login-pin').value.trim().toUpperCase();
            if(!dept || !pin) { document.getElementById('login-error').innerText = 'FILL ALL FIELDS'; document.getElementById('login-error').classList.remove('hidden'); return; }
            if(pin === deptPasswords[dept] || pin === 'NUESAADMIN26') {
                currentDept = dept; document.getElementById('active-dept-label').innerText = dept; document.getElementById('login-modal').style.display = 'none'; await loadRoster();
            } else {
                document.getElementById('login-error').innerText = 'INCORRECT PASSWORD'; document.getElementById('login-error').classList.remove('hidden');
            }
        };

        async function loadRoster() {
            onSnapshot(doc(db, "nuesa_fest_rosters", currentDept), (docSnap) => {
                if(docSnap.exists() && docSnap.data().players) { rosterData = docSnap.data().players; } else { rosterData = []; }
                renderRoster(); updateLimitTracker();
            });
        }

        window.updateLimitTracker = () => {
            const sport = document.getElementById('pSport').value;
            if(!sport) return;
            const limits = sportLimits[sport];
            let count = 0, males = 0, females = 0;
            rosterData.forEach(p => { if(p.sport === sport) { count++; if(p.gender === 'Male') males++; else females++; }});
            
            let text = `${sport}: ${count}/${limits.max} Registered`;
            if(limits.maleMax !== undefined || limits.femaleMax !== undefined) text += ` (M: ${males}/${limits.maleMax !== undefined ? limits.maleMax : 'Any'}, F: ${females}/${limits.femaleMax !== undefined ? limits.femaleMax : 'Any'})`;
            else if(limits.minFemale) text += ` (Min ${limits.minFemale} Female req. Currently: ${females})`;
            document.getElementById('sport-limit-tracker').innerText = text;
        };

        function renderRoster() {
            const container = document.getElementById('roster-list');
            document.getElementById('roster-count').innerText = `${rosterData.length} Total Registered`;
            container.innerHTML = '';
            
            if(rosterData.length === 0) { container.innerHTML = '<div class="text-center py-4 text-slate-500 font-bold uppercase tracking-widest">Roster is empty.</div>'; return; }

            const grouped = rosterData.reduce((acc, player) => {
                if (!acc[player.sport]) acc[player.sport] = []; acc[player.sport].push(player); return acc;
            }, {});

            for (const [sport, players] of Object.entries(grouped)) {
                let mCount = 0, fCount = 0, cCount = 0;
                players.forEach(p => { if(p.gender === 'Male') mCount++; else fCount++; if(p.role === 'Coach') cCount++; });
                
                container.innerHTML += `
                    <div class="bg-slate-900 rounded-lg border border-slate-700 overflow-hidden">
                        <div class="bg-slate-800 px-4 py-2 flex justify-between items-center border-b border-slate-700">
                            <span class="text-sm text-white font-black uppercase tracking-widest">${sport}</span>
                            <span class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">Total: ${players.length} (M:${mCount} F:${fCount} Coaches:${cCount})</span>
                        </div>
                        <div class="p-2 space-y-1">
                            ${players.map(player => {
                                const originalIndex = rosterData.indexOf(player);
                                return `
                                <div class="flex flex-col md:flex-row justify-between md:items-center bg-slate-900/50 p-2 rounded hover:bg-slate-800 transition border border-slate-700/50">
                                    <div class="flex items-center flex-wrap gap-2">
                                        <span class="text-white font-bold uppercase text-sm">${player.name}</span> 
                                        ${player.role === 'Coach' ? `<span class="text-[10px] text-yellow-500 font-bold bg-yellow-900/30 px-1 rounded border border-yellow-900/50">COACH</span>` : `<span class="text-[10px] text-orange-400 font-bold bg-orange-900/30 px-1 rounded border border-orange-900/50">${player.level}</span>`}
                                        <span class="text-[10px] text-blue-400 font-mono bg-blue-900/30 px-1 rounded border border-blue-900/50" title="Receipt">${player.receipt || 'NO RECEIPT'}</span>
                                        <span class="text-[10px] text-slate-400 font-mono bg-slate-800 px-1 rounded border border-slate-600" title="Matric">${player.matric}</span>
                                        <span class="text-[10px] text-slate-500 uppercase">${player.gender === 'Male' ? 'M' : 'F'}</span>
                                    </div>
                                    ${isGateOpen ? `
                                    <div class="flex gap-3 justify-end items-center hide-on-print mt-2 md:mt-0">
                                        <button onclick="window.editAthlete(${originalIndex})" class="text-blue-400 hover:text-blue-300 text-[10px] font-bold uppercase tracking-widest"><i class="fa-solid fa-pen mr-1"></i>Edit</button>
                                        <button onclick="window.removeAthlete(${originalIndex})" class="text-red-500 hover:text-red-400 text-[10px] font-bold uppercase tracking-widest"><i class="fa-solid fa-trash mr-1"></i>Drop</button>
                                    </div>` : ''}
                                </div>`
                            }).join('')}
                        </div>
                    </div>`;
            }
        }

        document.getElementById('addAthleteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!isGateOpen) return;

            const editIndex = parseInt(document.getElementById('editIndex').value);
            const matricInput = document.getElementById('pMatric').value.trim().toUpperCase();
            const receiptInput = document.getElementById('pReceipt').value.trim().toUpperCase();
            const requiredCode = deptCodes[currentDept];
            const sport = document.getElementById('pSport').value;
            const gender = document.getElementById('pGender').value;
            const role = document.getElementById('pRole').value;

            // SMART RECEIPT VALIDATION
            if (role !== 'Coach' && !receiptInput.startsWith("CUB_")) {
                alert(`REGISTRATION FAILED:\nThe NUESA Dues Receipt number MUST start with 'CUB_'.`); return;
            }
            const existingUsersWithReceipt = rosterData.filter((p, idx) => p.receipt === receiptInput && idx !== editIndex);
            if (existingUsersWithReceipt.length > 0) {
                const isSameAthlete = existingUsersWithReceipt.every(p => p.matric === matricInput);
                if (!isSameAthlete) { alert(`REGISTRATION FAILED:\nReceipt ${receiptInput} is already registered to a different athlete.`); return; }
                const alreadyInSport = existingUsersWithReceipt.find(p => p.sport === sport);
                if (alreadyInSport) { alert(`REGISTRATION FAILED:\nThis athlete is already registered for ${sport}.`); return; }
            }

            // MATRIC VALIDATION & 3-BALL GAME RULE
            if (role !== 'Coach') {
                if (matricInput.length !== 9) { alert(`REGISTRATION FAILED:\nMatric Number must be exactly 9 characters.`); return; }
                if (!matricInput.includes(requiredCode)) { alert(`REGISTRATION FAILED:\nMatric Number must contain the code '${requiredCode}' for ${currentDept}.`); return; }
                
                if (ballGames.includes(sport)) {
                    let ballGameCount = 0;
                    rosterData.forEach((p, idx) => {
                        if (p.matric === matricInput && idx !== editIndex && ballGames.includes(p.sport)) ballGameCount++;
                    });
                    if (ballGameCount >= 3) { alert(`REGISTRATION FAILED:\nAthlete is already registered for 3 Ball Games. Max allowed is 3.`); return; }
                }
            }

            // LIMIT VALIDATION
            const limits = sportLimits[sport];
            let currentTotal = 0, currentMale = 0, currentFemale = 0;
            rosterData.forEach((p, idx) => {
                if (p.sport === sport && idx !== editIndex) {
                    currentTotal++;
                    if (p.gender === 'Male') currentMale++;
                    if (p.gender === 'Female') currentFemale++;
                }
            });

            if (currentTotal >= limits.max) { alert(`LIMIT REACHED: ${sport} allows a max of ${limits.max} participants.`); return; }
            if (gender === 'Male' && limits.maleMax !== undefined && currentMale >= limits.maleMax) { alert(`LIMIT REACHED: ${sport} allows max ${limits.maleMax} Males.`); return; }
            if (gender === 'Female' && limits.femaleMax !== undefined && currentFemale >= limits.femaleMax) { alert(`LIMIT REACHED: ${sport} allows max ${limits.femaleMax} Females.`); return; }
            if (gender === 'Male' && limits.minFemale !== undefined) {
                const femalesNeeded = Math.max(0, limits.minFemale - currentFemale);
                if ((limits.max - currentTotal) - 1 < femalesNeeded) { alert(`RESERVATION REQUIRED:\n${sport} requires minimum ${limits.minFemale} Female(s). You must save the remaining slots.`); return; }
            }

            const athleteData = {
                name: document.getElementById('pName').value.trim().toUpperCase(),
                matric: matricInput, receipt: receiptInput,
                level: document.getElementById('pLevel').value,
                gender: gender, role: role, sport: sport,
                phone: document.getElementById('pPhone').value.trim()
            };
            
            if (editIndex >= 0) { rosterData[editIndex] = athleteData; } else { rosterData.push(athleteData); }
            await setDoc(doc(db, "nuesa_fest_rosters", currentDept), { players: rosterData }, { merge: true });
            window.cancelEdit();
        });

        window.editAthlete = (index) => {
            if(!isGateOpen) return;
            const p = rosterData[index];
            document.getElementById('pName').value = p.name; document.getElementById('pMatric').value = p.matric;
            document.getElementById('pReceipt').value = p.receipt || '';
            document.getElementById('pLevel').value = p.level || ''; document.getElementById('pGender').value = p.gender || '';
            document.getElementById('pRole').value = p.role || 'Athlete'; document.getElementById('pPhone').value = p.phone || '';
            document.getElementById('pSport').value = p.sport; document.getElementById('editIndex').value = index;
            
            document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-pen text-blue-500 mr-2"></i> Edit Record';
            document.getElementById('btnAdd').innerText = 'UPDATE RECORD';
            document.getElementById('btnAdd').classList.replace('bg-emerald-600', 'bg-blue-600'); document.getElementById('btnAdd').classList.replace('hover:bg-emerald-500', 'hover:bg-blue-500');
            document.getElementById('btnCancel').classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' }); updateLimitTracker();
        };

        window.cancelEdit = () => {
            document.getElementById('addAthleteForm').reset(); document.getElementById('editIndex').value = "-1";
            document.getElementById('form-title').innerText = 'Add Participant'; document.getElementById('btnAdd').innerText = 'ADD PARTICIPANT';
            document.getElementById('btnAdd').classList.replace('bg-blue-600', 'bg-emerald-600'); document.getElementById('btnAdd').classList.replace('hover:bg-blue-500', 'hover:bg-emerald-500');
            document.getElementById('btnCancel').classList.add('hidden'); updateLimitTracker();
        };

        window.removeAthlete = async (index) => {
            if(!isGateOpen || !confirm("Drop this participant from the official roster?")) return;
            rosterData.splice(index, 1);
            await setDoc(doc(db, "nuesa_fest_rosters", currentDept), { players: rosterData }, { merge: true });
            if(parseInt(document.getElementById('editIndex').value) === index) window.cancelEdit();
        };

        window.downloadRosterPDF = () => {
            const buttons = document.querySelectorAll('.hide-on-print'); buttons.forEach(b => b.style.display = 'none');
            const element = document.getElementById('roster-print-area');
            html2pdf().set({ margin: 0.5, filename: `NUESA_FEST26_${currentDept}_ROSTER.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#0f172a' }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } }).from(element).save().then(() => { buttons.forEach(b => b.style.display = 'flex'); });
        };
    </script>
</body>
</html>
